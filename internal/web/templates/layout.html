{{define "header"}}
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{.Title}}</title>
	<script src="https://unpkg.com/htmx.org@2.0.4"></script>
	<style>
		:root {
			--bg: #0f1117; --panel: #171a23; --border: #2a2e3a; --text: #e6e8ee;
			--muted: #8b90a0; --accent: #6d8dfc; --danger: #e2645a; --ok: #4fbf7a;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0; background: var(--bg); color: var(--text);
			font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px;
		}
		a { color: var(--accent); text-decoration: none; }
		header {
			padding: 14px 24px; border-bottom: 1px solid var(--border);
			display: flex; align-items: center; justify-content: space-between;
		}
		header .brand { font-weight: 600; font-size: 16px; }
		main { padding: 24px; max-width: 1200px; margin: 0 auto; }
		.board { display: flex; gap: 16px; overflow-x: auto; align-items: flex-start; }
		.column { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
			min-width: 240px; flex: 1; padding: 10px; }
		.column h3 { margin: 4px 8px 10px; font-size: 12px; text-transform: uppercase;
			letter-spacing: .04em; color: var(--muted); }
		.card { background: #1e2230; border: 1px solid var(--border); border-radius: 8px;
			padding: 10px 12px; margin-bottom: 8px; display: block; }
		.card:hover { border-color: var(--accent); }
		.card .name { color: var(--text); font-weight: 500; }
		.card .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
		.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
			padding: 18px; margin-bottom: 18px; }
		.panel h2 { margin-top: 0; font-size: 14px; text-transform: uppercase; color: var(--muted); }
		input, textarea, select, button {
			font: inherit; background: #12141c; color: var(--text); border: 1px solid var(--border);
			border-radius: 6px; padding: 8px 10px;
		}
		textarea { width: 100%; resize: vertical; }
		button { background: var(--accent); color: #0b0d12; border: none; cursor: pointer; font-weight: 600; }
		button:hover { opacity: .9; }
		button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
		.row { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
		.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
			border: 1px solid var(--border); color: var(--muted); }
		.draft { background: #12141c; border: 1px solid var(--border); border-radius: 8px;
			padding: 10px; margin-bottom: 10px; }
		table { width: 100%; border-collapse: collapse; }
		td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
		.muted { color: var(--muted); }
		ul.plain { margin: 4px 0; padding-left: 18px; }
		.progressbar { position: relative; height: 8px; border-radius: 999px; background: #12141c;
			overflow: hidden; border: 1px solid var(--border); margin: 4px 0 10px; }
		.progressbar-fill { position: absolute; top: 0; left: -40%; width: 40%; height: 100%;
			background: linear-gradient(90deg, transparent, var(--accent), transparent);
			animation: outreach-indeterminate 1.1s ease-in-out infinite; }
		@keyframes outreach-indeterminate { 0% { left: -40%; } 100% { left: 100%; } }
		.progress-msg { display: flex; align-items: center; gap: 8px; }
		.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border);
			border-top-color: var(--accent); animation: outreach-spin .7s linear infinite; flex: none; }
		@keyframes outreach-spin { to { transform: rotate(360deg); } }
	</style>
</head>
<body>
	<header>
		<div class="brand"><a href="/">Outreach Engine</a></div>
		<div class="muted">research &rarr; draft &rarr; track</div>
	</header>
	<main>
{{end}}
{{define "footer"}}
	</main>
</body>
</html>
{{end}}
